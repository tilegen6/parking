name: CI/CD Pipeline

# Один общий пайплайн для монорепо. Работает на всех ветках:
#   main, backend, cv, devops, frontend.
# Какие job'ы запускать — решает фильтр путей (dorny/paths-filter),
# поэтому ветка без папки frontend/ просто пропустит frontend-job.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Отменяем устаревшие прогоны на той же ветке/PR, чтобы не жечь раннеры
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/smart-parking

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # 0. DETECT CHANGES — что менялось в этом push/PR
  # ─────────────────────────────────────────────
  changes:
    name: "Detect changed areas"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      cv: ${{ steps.filter.outputs.cv }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci-cd.yml'
            cv:
              - 'cv/**'
              - '.github/workflows/ci-cd.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-cd.yml'

  # ─────────────────────────────────────────────
  # 1. BACKEND — FastAPI (ruff + mypy + pytest)
  # ─────────────────────────────────────────────
  backend:
    name: "Backend — Lint & Test"
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff — linter
        run: ruff check backend/

      - name: Ruff — formatter
        run: ruff format --check backend/

      - name: Mypy — type checker
        working-directory: backend
        # Бэкенд ещё в раннем развитии: типы проверяем и показываем,
        # но не блокируем CI. Убрать continue-on-error, когда код созреет.
        continue-on-error: true
        run: |
          if find src -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            mypy src/
          else
            echo "backend/src has no Python yet — skipping mypy"
          fi

      - name: Pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          if find tests -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            pytest --tb=short -q
          else
            echo "No backend tests yet — skipping"
          fi

  # ─────────────────────────────────────────────
  # 2. CV SERVICE — интеграционная лаборатория ANPR
  # ─────────────────────────────────────────────
  cv:
    name: "CV Service — Lint & Test"
    needs: changes
    if: ${{ needs.changes.outputs.cv == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: cv/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cv/requirements.txt -r cv/requirements-dev.txt

      - name: Ruff — linter
        run: ruff check cv/

      - name: Ruff — formatter
        run: ruff format --check cv/

      - name: Mypy — type checker
        # CV — лаборатория, типизация пока не строгая → не блокируем
        continue-on-error: true
        run: mypy cv/

      - name: Pytest
        working-directory: cv
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then
            pytest --tb=short -q
          else
            echo "No CV tests yet — skipping"
          fi

  # ─────────────────────────────────────────────
  # 3. FRONTEND — React + Vite + TS (eslint + tsc + build)
  # ─────────────────────────────────────────────
  frontend:
    name: "Frontend — Lint & Build"
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript check
        run: npm run typecheck
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  # ─────────────────────────────────────────────
  # 4. BUILD & PUSH DOCKER IMAGES (только main)
  # ─────────────────────────────────────────────
  build-and-push:
    name: "Docker — Build & Push (${{ matrix.service }})"
    needs: [backend, cv, frontend]
    # Запускаем на push в main, даже если часть job'ов выше была пропущена
    # (paths-filter мог не активировать неизменённые сервисы).
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # нужно для push в ghcr.io

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            image: backend
            dockerfile: ./backend/Dockerfile
            build_args: ""
          - service: frontend
            context: ./frontend
            image: frontend
            # Прод-образ фронта (nginx + статика), не dev-Dockerfile
            dockerfile: ./frontend/Dockerfile.prod
            # Публичный адрес API вшивается в бандл на этапе сборки (Vite).
            # PROD_DOMAIN — repo variable (Settings → Variables).
            build_args: |
              VITE_API_URL=https://${{ vars.PROD_DOMAIN }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image prefix
        # GHCR/Docker требуют имя репозитория в нижнем регистре, а owner
        # может содержать заглавные буквы (например CodeANPR) — приводим
        # к lowercase, иначе buildx падает на cache-from/cache-to.
        run: echo "IMAGE_PREFIX=ghcr.io/${OWNER,,}/smart-parking" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          # format=long → тег sha-<полный sha>, совпадает с github.sha в деплое
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:buildcache,mode=max

  # ─────────────────────────────────────────────
  # 5. DEPLOY → VPS (только main, с ручным подтверждением)
  # ─────────────────────────────────────────────
  deploy:
    name: "Deploy to VPS"
    needs: [build-and-push]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # Protected environment → деплой ждёт ручного подтверждения (required reviewers)
    environment: production
    # Не отменяем идущий деплой и не запускаем два параллельно
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH (pull GHCR images + compose up)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/smart-parking
            git pull --ff-only
            export IMAGE_TAG=sha-${{ github.sha }}
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile backup"
            $COMPOSE pull
            $COMPOSE up -d
            docker image prune -f
