name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'backend/**'
      - 'frontend/**'
      - 'cv/**'
      - 'devops/**'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/smart-parking

# ─────────────────────────────────────────────
# 1. BACKEND
# ─────────────────────────────────────────────
jobs:
  backend-lint-and-test:
    name: "Backend — Lint & Test"
    runs-on: ubuntu-latest
    # Запускаем только при изменениях в backend/ или на main
    if: |
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.modified, 'backend/') ||
      startsWith(github.head_ref, 'backend/')

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff — linter
        run: ruff check backend/

      - name: Ruff — formatter
        run: ruff format --check backend/

      - name: Mypy — type checker
        run: mypy backend/src/

      - name: Pytest
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          pytest --tb=short -q || echo "No tests yet"

  # ─────────────────────────────────────────────
  # 2. FRONTEND (User + Admin в монорепо)
  # ─────────────────────────────────────────────
  frontend-lint-and-build:
    name: "Frontend — Lint & Build"
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.modified, 'frontend/') ||
      startsWith(github.head_ref, 'frontend/')

    strategy:
      matrix:
        app: [user, admin]   # папки frontend/user/ и frontend/admin/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend/${{ matrix.app }}

      - name: ESLint
        run: npm run lint --prefix frontend/${{ matrix.app }}

      - name: TypeScript check
        run: npm run typecheck --prefix frontend/${{ matrix.app }}
        # Если скрипта нет — замените на: npx tsc --noEmit
        continue-on-error: false

      - name: Build
        run: npm run build --prefix frontend/${{ matrix.app }}

  # ─────────────────────────────────────────────
  # 3. CV SERVICE
  # ─────────────────────────────────────────────
  cv-lint-and-test:
    name: "CV Service — Lint & Test"
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.modified, 'cv/') ||
      startsWith(github.head_ref, 'cv/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'cv/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Ultralytics тяжёлый — устанавливаем без GPU-зависимостей
          pip install -r cv/requirements.txt

      - name: Ruff — linter
        run: ruff check cv/

      - name: Ruff — formatter
        run: ruff format --check cv/

      - name: Mypy — type checker
        run: mypy cv/src/ || echo "Mypy not configured yet"

      - name: Pytest
        run: |
          cd cv
          pytest --tb=short -q || echo "No tests yet"

  # ─────────────────────────────────────────────
  # 4. BUILD & PUSH DOCKER IMAGES (только main)
  # ─────────────────────────────────────────────
  build-and-push:
    name: "Docker — Build & Push"
    needs: [backend-lint-and-test, frontend-lint-and-build, cv-lint-and-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write   # нужно для ghcr.io

    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            image: backend
          - service: cv
            context: ./cv
            image: cv
          # Frontend собирается в статику и отдаётся Nginx —
          # добавьте сюда, если у вас есть отдельный Dockerfile для фронта

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build & Push — ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кешируем слои в ghcr.io, чтобы повторные билды были быстрее
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:buildcache,mode=max

  # ─────────────────────────────────────────────
  # 5. DEPLOY + HEALTH CHECK
  # ─────────────────────────────────────────────
  deploy:
    name: "Deploy to Server"
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /home/${{ secrets.SERVER_USER }}/smart-parking

            echo "==> Pull latest code"
            git pull origin main

            echo "==> Log in to GHCR"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Pull new images"
            docker compose pull

            echo "==> Rolling restart (zero-downtime для stateless-сервисов)"
            docker compose up -d --remove-orphans

            echo "==> Clean up old images"
            docker image prune -f

      - name: Health Check
        # Даём сервисам 30 секунд подняться, затем проверяем эндпоинты
        run: |
          sleep 30

          check() {
            local name=$1
            local url=$2
            local status

            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url")
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              echo "✅  $name — HTTP $status"
            else
              echo "❌  $name — HTTP $status"
              exit 1
            fi
          }

          # Замените на реальные URL ваших сервисов
          check "Backend API"   "http://${{ secrets.SERVER_HOST }}/api/health"
          check "CV Service"    "http://${{ secrets.SERVER_HOST }}/cv/health"
          check "Frontend User" "http://${{ secrets.SERVER_HOST }}/"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Деплой или health-check упал. Проверьте логи: docker compose logs --tail=50"
          # Сюда можно добавить Telegram / Slack уведомление
