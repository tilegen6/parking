name: CI/CD Pipeline

# Один общий пайплайн для монорепо. Работает на всех ветках:
#   main, backend, cv, devops, frontend.
# Какие job'ы запускать — решает фильтр путей (dorny/paths-filter),
# поэтому ветка без папки frontend/ просто пропустит frontend-job.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Отменяем устаревшие прогоны на той же ветке/PR, чтобы не жечь раннеры
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/smart-parking

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # 0. DETECT CHANGES — что менялось в этом push/PR
  # ─────────────────────────────────────────────
  changes:
    name: "Detect changed areas"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      cv: ${{ steps.filter.outputs.cv }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci-cd.yml'
            cv:
              - 'cv/**'
              - '.github/workflows/ci-cd.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-cd.yml'

  # ─────────────────────────────────────────────
  # 1. BACKEND — FastAPI (ruff + mypy + pytest)
  # ─────────────────────────────────────────────
  backend:
    name: "Backend — Lint & Test"
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff — linter
        run: ruff check backend/

      - name: Ruff — formatter
        run: ruff format --check backend/

      - name: Mypy — type checker
        working-directory: backend
        # Бэкенд ещё в раннем развитии: типы проверяем и показываем,
        # но не блокируем CI. Убрать continue-on-error, когда код созреет.
        continue-on-error: true
        run: |
          if find src -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            mypy src/
          else
            echo "backend/src has no Python yet — skipping mypy"
          fi

      - name: Pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          if find tests -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            pytest --tb=short -q
          else
            echo "No backend tests yet — skipping"
          fi

  # ─────────────────────────────────────────────
  # 2. CV SERVICE — интеграционная лаборатория ANPR
  # ─────────────────────────────────────────────
  cv:
    name: "CV Service — Lint & Test"
    needs: changes
    if: ${{ needs.changes.outputs.cv == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: cv/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cv/requirements.txt -r cv/requirements-dev.txt

      - name: Ruff — linter
        run: ruff check cv/

      - name: Ruff — formatter
        run: ruff format --check cv/

      - name: Mypy — type checker
        # CV — лаборатория, типизация пока не строгая → не блокируем
        continue-on-error: true
        run: mypy cv/

      - name: Pytest
        working-directory: cv
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then
            pytest --tb=short -q
          else
            echo "No CV tests yet — skipping"
          fi

  # ─────────────────────────────────────────────
  # 3. FRONTEND — React + Vite + TS (eslint + tsc + build)
  # ─────────────────────────────────────────────
  frontend:
    name: "Frontend — Lint & Build"
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript check
        run: npm run typecheck
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  # ─────────────────────────────────────────────
  # 4. BUILD & PUSH DOCKER IMAGES (только main)
  # ─────────────────────────────────────────────
  build-and-push:
    name: "Docker — Build & Push (${{ matrix.service }})"
    needs: [backend, cv, frontend]
    # Запускаем на push в main, даже если часть job'ов выше была пропущена
    # (paths-filter мог не активировать неизменённые сервисы).
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # нужно для push в ghcr.io

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            image: backend
          - service: frontend
            context: ./frontend
            image: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image prefix
        # GHCR/Docker требуют имя репозитория в нижнем регистре, а owner
        # может содержать заглавные буквы (например CodeANPR) — приводим
        # к lowercase, иначе buildx падает на cache-from/cache-to.
        run: echo "IMAGE_PREFIX=ghcr.io/${OWNER,,}/smart-parking" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:buildcache,mode=max

  # ─────────────────────────────────────────────
  # 5. DEPLOY + HEALTH CHECK (только main)
  # ─────────────────────────────────────────────
  deploy:
    name: "Deploy to Server"
    needs: build-and-push
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /home/${{ secrets.SERVER_USER }}/smart-parking

            echo "==> Pull latest code"
            git pull origin main

            echo "==> Log in to GHCR"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Pull new images"
            docker compose pull

            echo "==> Rolling restart"
            docker compose up -d --remove-orphans

            echo "==> Clean up old images"
            docker image prune -f

      - name: Health Check
        run: |
          sleep 30

          check() {
            local name=$1
            local url=$2
            local status

            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url")
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              echo "✅  $name — HTTP $status"
            else
              echo "❌  $name — HTTP $status"
              exit 1
            fi
          }

          check "Backend API"   "http://${{ secrets.SERVER_HOST }}/api/health"
          check "Frontend"      "http://${{ secrets.SERVER_HOST }}/"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Деплой или health-check упал. Логи: docker compose logs --tail=50"
