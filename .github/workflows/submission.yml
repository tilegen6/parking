name: Submission materials
on:
  push:
    paths: ['README.md', 'docs/pre-defense/**', 'scripts/*submission*.py', '.github/workflows/submission.yml']
  pull_request:
    paths: ['README.md', 'docs/pre-defense/**', 'scripts/*submission*.py', '.github/workflows/submission.yml']
permissions:
  contents: read
jobs:
  materials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_submission.py all
