repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        # docker-compose.prod.yml использует валидные для Compose кастомные теги
        # (!override / !reset), которые стандартный YAML-парсер check-yaml не грузит.
        exclude: ^docker-compose\.prod\.yml$
      - id: end-of-file-fixer
      - id: trailing-whitespace
