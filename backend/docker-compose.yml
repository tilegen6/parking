# Полный стек умной парковки: backend + frontend + Postgres + Redis + MinIO.
# Учётные данные берутся из .env; у каждой переменной есть дефолт ${VAR:-...},
# поэтому стек поднимается даже без заполненного .env (удобно для первого запуска).

services:
  postgres:
    image: postgres:16-alpine
    container_name: parking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parking_password}
      POSTGRES_DB: ${POSTGRES_DB:-parking_db}
    ports:
      # если локальный Postgres уже занимает 5432 — поменяйте на "5433:5432"
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parking_user} -d ${POSTGRES_DB:-parking_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: parking_redis
    restart: unless-stopped
    # Обязательный пароль (если REDIS_PASSWORD пуст — Redis стартует без авторизации)
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: parking_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    ports:
      - "9000:9000"   # S3 API (сюда ходит backend)
      - "9001:9001"   # Веб-консоль (http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      # curl надёжнее, чем "mc ready" (mc нет в server-образе)
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: parking_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Принудительно адресуем сервисы по именам docker-сети, что бы ни стояло в .env
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Сначала прогоняем миграции БД, затем поднимаем API
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000"
    # health backend берётся из HEALTHCHECK в Dockerfile (GET /health)

  frontend:
    build: ../frontend
    container_name: parking_frontend
    restart: unless-stopped
    environment:
      # Браузер обращается к backend по localhost (а не по имени docker-сети)
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
