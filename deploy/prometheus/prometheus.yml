# Prometheus: сбор метрик контейнеров, PostgreSQL, Redis, MinIO + HTTP-пробы.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Метрики всех контейнеров (CPU / RAM / сеть / диск)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Метрики хоста
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # PostgreSQL
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Redis
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # MinIO отдаёт метрики нативно (нужен MINIO_PROMETHEUS_AUTH_TYPE=public)
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  # Проверка доступности сервисов по HTTP (для алертов «сервис упал»)
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://backend:8000/health
          - http://frontend:5173/
          - http://minio:9000/minio/health/live
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
