# Внутренний nginx прод-образа фронтенда: отдаёт собранную статику Vite (dist).
# TLS и маршрутизация /api, /photos — на edge-nginx (см. deploy/nginx.conf.template).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ассеты с хешем в имени — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: любой неизвестный путь отдаём index.html (клиентский роутинг React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
